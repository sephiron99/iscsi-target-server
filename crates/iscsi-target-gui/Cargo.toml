[package]
name = "iscsi-target-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows GUI for the iSCSI target server"

[dependencies]
# GUI는 명령줄 server와 같은 라이브러리 API로 서버를 띄우고 관리한다.
iscsi-target-server.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
] }

# WinSafe는 Win32 전용이라 Windows target에서만 의존한다. `gui`는 창과 control,
# `shell`은 설정 파일을 고르는 IFileOpenDialog에 필요하다.
[target.'cfg(windows)'.dependencies]
winsafe = { workspace = true, features = ["gui", "shell"] }
