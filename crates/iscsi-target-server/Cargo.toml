[package]
name = "iscsi-target-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "User-space iSCSI target server for Windows 10/11 (RFC 7143)"

[dependencies]
base64 = "0.22"
bytes.workspace = true
crc32c = "0.6"
getrandom = "0.4"
md-5 = { version = "0.11", features = ["zeroize"] }
subtle = "2.6"
thiserror.workspace = true
zeroize = "1.8"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
tokio-util = { version = "0.7", features = ["codec"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# 창과 무관한 Win32 wrapper만 쓴다. 현지 시각을 `unsafe` 없이 읽는 데 필요하다.
winsafe = { workspace = true, features = ["kernel"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
# 기동 로그의 내용을 테스트에서 붙잡아 확인하는 데 쓴다.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
] }
