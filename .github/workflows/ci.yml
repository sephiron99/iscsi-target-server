name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup default stable
          rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      # .cargo/config.toml의 기본 target(i686-pc-windows-gnu)은 runner에 mingw-w64
      # toolchain이 없어 쓸 수 없으므로 runner의 MSVC target을 명시한다.
      - name: Test
        run: cargo test --workspace --target x86_64-pc-windows-msvc
      - name: Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
