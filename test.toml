# iscsi-targetd 수동 테스트용 설정.
#
# 검증:  iscsi-targetd.exe --config test.toml --check
# 실행:  iscsi-targetd.exe --config test.toml --log-level debug
#
# 실행 후 Windows `iscsicpl`에서 포털 127.0.0.1:3260을 추가해 연결한다.
# daemon은 단일 Target만 지원한다. 여러 disk는 한 Target의 여러 LUN으로 내보낸다.

version = 1

[listen]
# 다른 PC의 Initiator에서 접속하려면 "0.0.0.0"으로 바꾸고 TCP 3260 인바운드를 허용한다.
address = "127.0.0.1"
port = 3260

[[targets]]
name = "iqn.2026-10.local.test:disk"

# LUN 0: 640MiB memory disk. 파일이나 장치 없이 바로 동작하며 종료하면 내용이 사라진다.
[[targets.luns]]
lun = 0
backend = "memory"
block-size = 512
block-count = 1310720

# 이미지 파일 LUN. 파일은 미리 만들어 두어야 하고 크기는 block-size의 배수여야 한다.
# 상대 경로는 이 설정 파일의 위치를 기준으로 해석한다.
# [[targets.luns]]
# lun = 1
# backend = "file"
# path = "test-disk.img"
# block-size = 512
# read-only = false
# durable-flush = true

# USB 등 물리 disk 전체. 관리자 권한이 필요하다. device-number는
# `Get-Disk`의 Number이며 IsSystem = True인 disk는 사용하지 않는다.
# serve를 시작하면 경고 로그를 남기고 disk를 offline으로 바꾸며 종료할 때 online으로
# 되돌린다. offline 전환에 실패한 disk는 경고 후 online 상태로 serve한다.
#
# 같은 PC의 Initiator로 접속할 때는 virtual-disk-identity = true가 필요하다. 원본 disk와
# iSCSI disk의 식별자가 겹치면 Windows가 iSCSI disk를 "Redundant Path"로 offline 처리하기
# 때문이다. 이 옵션은 Initiator에게 MBR signature, GPT disk GUID와 partition GUID만 다른
# 값으로 보여 주며 원본 disk의 값은 바꾸지 않는다. 다른 PC의 Initiator만 쓴다면 필요 없다.
# [[targets.luns]]
# lun = 2
# backend = "windows-physical-drive"
# device-number = 1
# read-only = true
# virtual-disk-identity = true

# volume 단위 serve. 관리자 권한이 필요하다.
# [[targets.luns]]
# lun = 3
# backend = "windows-volume"
# drive-letter = "E"
# read-only = true
