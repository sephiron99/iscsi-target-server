# WSL에서 Windows 32bit binary를 cross-build하기 위한 설정.
#
# cross-build는 `cargo cross`(cargo-cross)를 사용한다. cargo-cross가 mingw-w64
# toolchain을 내려받아 linker를 구성하므로 별도의 linker 설정은 두지 않는다.
# cargo-cross는 MSVC target을 지원하지 않으므로 target은 i686-pc-windows-gnu이다.
#
# 사용법:
#   cargo build-win32        # 32bit Windows daemon binary (release)
#   cargo cross build -F daemon
#   cargo cross test --all-features   # WSL interop으로 Windows test binary를 실행
#
# 결과물: target/i686-pc-windows-gnu/release/iscsi-targetd.exe

[alias]
build-win32 = "cross build --release --features daemon"

# `cargo cross`는 `-t`가 없으면 이 값을 기본 target으로 사용한다.
# 이 값은 `cargo cross`를 거치지 않는 cargo 명령에도 적용된다. mingw-w64 toolchain이
# PATH에 없는 host에서는 `cargo cross`를 쓰거나 `--target`으로 target을 명시한다.
[build]
target = "i686-pc-windows-gnu"
