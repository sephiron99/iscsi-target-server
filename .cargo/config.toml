# Windows binary를 빌드하기 위한 설정. target은 MSVC 둘이다.
#
#   x86_64-pc-windows-msvc   64bit, 기본 target
#   i686-pc-windows-msvc     32bit
#
# Windows에서는 평소의 cargo 명령을 그대로 쓴다.
#
# WSL에서는 Windows에 설치된 MSVC linker를 부르는 스크립트
# (https://github.com/sephiron99/msvc-wsl-rust)로 cross-build한다. 그 설정은 PC마다 다르므로
# 이 저장소가 아니라 WSL 사용자의 `~/.cargo/config.toml`에 둔다. 준비:
#
#   1. Windows에 Visual Studio 또는 Build Tools의 C++ 빌드 도구를 설치한다.
#   2. 스크립트를 받고, 그 안의 config.sh에 MSVC와 Windows SDK 버전을 맞춘다.
#   3. `rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc`
#   4. `~/.cargo/config.toml`에 아래를 넣는다. 경로는 스크립트를 받은 위치의 절대 경로이다.
#
#        [target.x86_64-pc-windows-msvc]
#        linker = "/path/to/msvc-linker/linker-x64.sh"
#
#        [target.i686-pc-windows-msvc]
#        linker = "/path/to/msvc-linker/linker-x86.sh"
#
# 그 뒤에는 평소의 cargo 명령과 아래 alias를 쓴다.
#
#   cargo build-win64     release 실행 파일 (64bit)
#   cargo build-win32     release 실행 파일 (32bit)
#   cargo test-win64      전체 테스트 (64bit). WSL interop으로 Windows test binary를 실행한다
#   cargo test-win32      전체 테스트 (32bit)
#   cargo clippy-win64    lint
#
#   결과물: target/<target>/release/iscsi-targetd.exe
#
# 위 주소는 원본(strickczq/msvc-wsl-rust)의 fork이다. 원본과 달리 link 결과물에 실행 권한을
# 주고 여러 binary의 동시 link를 지원한다. `cargo test`가 test binary를 실행하고 병렬로
# link하려면 이 두 가지가 필요하므로 원본이 아니라 fork를 쓴다.

[alias]
build-win64 = "build --release -p iscsi-targetd --target x86_64-pc-windows-msvc"
build-win32 = "build --release -p iscsi-targetd --target i686-pc-windows-msvc"
test-win64 = "test --workspace --target x86_64-pc-windows-msvc"
test-win32 = "test --workspace --target i686-pc-windows-msvc"
clippy-win64 = "clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings"

[build]
target = "x86_64-pc-windows-msvc"

# C runtime을 실행 파일에 넣는다. 넣지 않으면 VCRUNTIME140.dll이 필요해 Visual C++
# 재배포 패키지가 없는 PC에서 실행되지 않는다. Windows에서 직접 빌드할 때도 적용된다.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
