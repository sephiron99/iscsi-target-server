[package]
name = "pdu"
version = "0.1.0"
edition = "2021"
description = "iSCSI PDU 파싱/직렬화 (RFC 7143)"

[dependencies]
base64 = "0.22"
bytes = "1"
crc32c = "0.6"
getrandom = "0.4"
md-5 = { version = "0.11", features = ["zeroize"] }
subtle = "2.6"
thiserror = "2"
zeroize = "1.8"
# codec feature에서만 사용
tokio-util = { version = "0.7", features = ["codec"], optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[features]
default = []
# tokio 기반 Framed codec (IscsiCodec) 활성화
codec = ["dep:tokio-util", "dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
