[workspace]
resolver = "3"
members = [
    "crates/iscsi-target-server",
    "crates/iscsi-targetd",
    "crates/iscsi-target-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# workspace 안의 패키지. publish하려면 path와 함께 version이 있어야 한다.
iscsi-target-server = { path = "crates/iscsi-target-server", version = "0.1.0" }

bytes = "1"
thiserror = "2"
tokio = "1"
tracing = "0.1"
