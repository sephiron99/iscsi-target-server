[package]
name = "pdu"
version = "0.1.0"
edition = "2021"
description = "iSCSI PDU 파싱/직렬화 (RFC 7143)"

[dependencies]
bytes = "1"
crc32c = "0.6"
thiserror = "2"
# codec feature에서만 사용
tokio-util = { version = "0.7", features = ["codec"], optional = true }

[features]
default = []
# tokio 기반 Framed codec (IscsiCodec) 활성화
codec = ["dep:tokio-util"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
