[package]
name = "pdu"
version = "0.1.0"
edition = "2021"
description = "iSCSI PDU 파싱/직렬화 (RFC 7143)"

[dependencies]
base64 = "0.22"
bytes = "1"
crc32c = "0.6"
getrandom = "0.4"
md-5 = { version = "0.11", features = ["zeroize"] }
subtle = "2.6"
thiserror = "2"
zeroize = "1.8"
# codec feature에서만 사용
tokio-util = { version = "0.7", features = ["codec"], optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
# tracing/daemon feature에서만 사용
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "fmt",
    "std",
], optional = true }

[[bin]]
name = "iscsi-targetd"
path = "src/main.rs"
required-features = ["daemon"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[features]
default = []
# tokio 기반 Framed codec (IscsiCodec) 활성화
codec = ["dep:tokio-util", "dep:tokio"]
# service 계층의 구조화된 tracing event 계측
tracing = ["dep:tracing"]
# headless daemon 계층과 iscsi-targetd binary
daemon = [
    "codec",
    "tracing",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/signal",
]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
